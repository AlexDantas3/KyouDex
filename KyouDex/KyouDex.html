<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<script>try{var d=document.documentElement;d.dataset.tema=localStorage.getItem('kyoudex:tema')||'light';var a=localStorage.getItem('kyoudex:animacoes');d.dataset.animacoes=a||'on';var v=JSON.parse(localStorage.getItem('kyoudex:cor-vars'));if(v){d.style.setProperty('--red',v.a);d.style.setProperty('--red-dark',v.b);d.style.setProperty('--red-soft',v.c)}}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KyouDex</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="Syles.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="top-left"><div class="avatar"><i></i></div><div class="dots"><i></i><i></i><i></i></div></div>
    <div class="logo"><img src="logo-kyoudex.png" alt="KyouDex"></div>
    <div class="top-right">
      <button class="config-btn" id="config" type="button" aria-label="Abrir configurações" aria-haspopup="dialog" aria-expanded="false" title="Configurações">
        <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M19.4 15a1.7 1.7 0 00.3 1.9l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.9-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.9.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.9 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.9l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.9.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.9-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.9V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      </button>
      <div class="online">Sistema online</div>
    </div>
  </header>

  <nav class="crumbs">
    <a class="home" href="KyouDex.html">Início <span class="seta">→</span></a>
  </nav>

  <main class="body">
    <aside class="side">
      <h4><span>Filtros</span><span>⚙</span></h4>
      <label class="search">🔍︎<input id="busca" type="text" placeholder="Nome ou N°"></label>
      <div class="lbl">Região</div>
      <div class="regs-wrap"><div class="regs" id="regioes"></div></div>
      <div class="lbl" style="border:0;padding-top:0">Tipagem</div>
      <div class="chips" id="tipos"></div>
      <div class="foot">
        <small>Capturados</small>
        <b id="contador">000</b>
        <em>El 1 Ger 2001/Hard</em>
      </div>
    </aside>

    <section>
      <div class="head">
        <div>
          <div class="eyebrow" id="eyebrow">Arquivo nacional // Kanto</div>
          <h1>Pokémon registrados</h1>
        </div>
        <div class="head-dir">
        <div class="tools">
          <label class="sort">Ordem
            <select id="ordem">
              <option value="asc">N° crescente</option>
              <option value="desc">N° decrescente</option>
              <option value="nome">Nome (A–Z)</option>
            </select>
          </label>
          <button class="view" id="visao" title="Alternar visualização">⊞</button>
        </div>
      </div>
      </div>
      <div class="linha-filtros">
      <div class="seg" id="seg" role="group" aria-label="Filtrar por captura">
        <button type="button" data-c="todos" class="on" aria-pressed="true">Todos</button>
        <button type="button" data-c="capturados" aria-pressed="false">Capturados</button>
        <button type="button" data-c="faltando" aria-pressed="false">Faltando</button>
      </div>
      <button class="fav-filtro" id="soFav" type="button" aria-pressed="false"><svg viewBox="0 0 24 24" width="12" height="12" aria-hidden="true"><path d="M12 20s-7-4.6-7-10a4 4 0 017-2.6A4 4 0 0119 10c0 5.4-7 10-7 10z" stroke-linejoin="round"/></svg>Favoritos</button>
      </div>
      <div class="grid" id="grid"></div>
    </section>
  </main>

  <footer class="bottom">
    <div class="bl"><div class="ring">ⓘ</div><div>Sessão principal<small>12:00 • 13:00</small></div></div>
    <nav><span>Pesquisar</span><span>Mapa</span><span>Ajuda</span></nav>
    <div class="br"><div class="usuario" id="usuarioNome">Visitante</div><div>KyouDex 1.0<small>Studio 2026</small></div><button class="pw" id="conta" type="button" aria-haspopup="dialog" aria-label="Entrar ou sair da conta" title="Entrar">⏻</button></div>
  </footer>
</div>

<script src="Comum.js"></script>
<script src="Script.js"></script>
</body>
</html>
